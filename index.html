<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İrfaniye Takip Sistemi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <div><h1>İrfaniye Takip Sistemi</h1><p>Talebe kayıt ve takip sistemi</p></div>
    <button id="logoutBtn" class="danger hidden">Çıkış Yap</button>
  </header>

  <section id="loginCard" class="card login">
    <h2>Yönetici Girişi</h2>
    <form id="loginForm">
      <label>E-posta<input id="email" type="email" required></label>
      <label>Şifre<input id="password" type="password" required></label>
      <button type="submit">Giriş Yap</button>
      <p id="loginMsg"></p>
    </form>
  </section>

  <main id="appArea" class="hidden">
    <section class="card">
      <h2>Talebe Ekle / Düzenle</h2>
      <form id="studentForm">
        <div class="grid">
          <label>Ad Soyad<input id="name" required></label>
          <label>Öğrenci No<input id="studentNo" required></label>
          <label>Veli Adı<input id="parentName"></label>
          <label>Veli Tel<input id="parentPhone" type="tel"></label>
          <label>Sınıf<input id="className"></label>
          <label>Yatakhane No<input id="dormNo"></label>
          <label class="full">Notlar<textarea id="notes" rows="3"></textarea></label>
        </div>
        <button type="submit" id="saveBtn">Talebeyi Kaydet</button>
        <button type="button" id="cancelBtn" class="secondary hidden">İptal</button>
      </form>
    </section>
    <section class="card">
      <div class="listHeader"><h2>Talebeler</h2><input id="search" placeholder="Ad, öğrenci no veya sınıf ara..."></div>
      <div id="studentList"></div>
    </section>
  </main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
